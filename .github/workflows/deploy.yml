nname: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드를 가상 공장으로 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 자바 환경 세팅 (자바 26 운영체제 맞춤)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      # 3. 금고에서 꺼내온 내용으로 빌드용 application-secret.yml 생성
      - name: Make application-secret.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_SECRET_YML }}" > src/main/resources/application-secret.yml

      # 4. 프로젝트 빌드 (.jar 파일 생성)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # ⭐ 5. [핵심 추가] 빌드된 jar 파일과 2단계에서 만든 docker-compose.yml을 AWS EC2로 전송하기
      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,docker-compose.yml,Dockerfile" # 내 컴퓨터에 있던 파일들을
          target: "/home/ubuntu/app"                              # EC2 서버의 이 폴더로 전송!
          strip_components: 2 # 빌드 폴더 경로 깊이를 깎아서 jar 파일만 깔끔하게 들어가도록 설정

      # 6. AWS EC2에 원격 접속해서 진짜 도커 실행하기
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

          # 2단계에서 만든 진짜 이름으로 jar 파일 매핑 (이름을 단순하게 통일해 줍니다)
            mv build/libs/*-SNAPSHOT.jar ./app.jar || true
            
          #  기존에 돌고 있던 도커 컨테이너가 있다면 끄고 새로 빌드해서 켜기!
            docker compose down || true
            docker compose up -d --build