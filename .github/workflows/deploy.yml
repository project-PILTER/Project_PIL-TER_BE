name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Make application-secret.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_SECRET_YML }}" > src/main/resources/application-secret.yml

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,docker-compose.yml,Dockerfile"
          target: "/home/ubuntu/app"
          strip_components: 2  # 폴더 구조(build/libs)를 떼어내고 파일만 복사되도록 합니다.

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

          # 1. 기존 빌드 결과물(파일명이 SNAPSHOT인 파일)을 app.jar로 안전하게 이름 변경
            mv *SNAPSHOT.jar ./app.jar || true
            
          # 2. 켜져 있는 구버전 컨테이너 끄기
            docker compose down || true
            
          # 3. 에러 유발하던 --no-cache 플래그를 떼고 정상적으로 재빌드 및 실행
            docker compose up -d --build

